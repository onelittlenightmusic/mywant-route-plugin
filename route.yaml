wantType:
  metadata:
    name: route
    title: Route Shown
    description: |
      Draws the way from one place to another on a map, for walking, cycling or
      driving.

      Nothing is computed here. The want holds the question — where from, where
      to, and how you are travelling — and the card answers it, geocoding the
      two ends with Nominatim and asking Valhalla for the line between them,
      both OpenStreetMap services that need no API key. That is deliberate: a
      key is one more thing to expire, and this one did.

      Transit is not offered. The routers that do it well are the paid ones, and
      transit_search already answers that question properly for Japan.
    version: '1.0'
    category: transport
    pattern: independent
    labels:
      # Drawn on the canvas as an arrow, like transit_search: two ends and a
      # line between them is what this want IS.
      form-type: arrow
      form-style: road
      # A thing dropped on this want is somewhere you want to GO.
      seed-param: to
      riffable: source
      # The card carries its own controls (swap the ends, change the mode), so
      # Enter on it is meant to reach them.
      user-control: "true"
      # type-icon, not category-icon: `transport` already belongs to
      # transit_search, and claiming the category's icon here changed the glyph
      # on a want type that has nothing to do with this one.
      type-icon: Route
      category-bg-light: "linear-gradient(160deg, #bbf7d0 0%, #ecfdf5 100%)"
      category-bg-dark: "linear-gradient(160deg, #166534 0%, #052e16 100%)"

  parameters:
    - name: from
      description: |
        Where the way starts: a station, an address, a place you have named, or
        a coordinate. A name you have given somewhere ("自宅") is resolved from
        your own places before anyone is asked to look it up.
      type: string
      required: true
      example: 国分寺駅
      # Recorded as a station, which is what a name typed in here usually is,
      # and takes the other ways of saying "somewhere" as well. See want-spec's
      # ParameterDef.Accepts.
      subType: station
      accepts: [place, location_coordinate, address, location]

    - name: via
      description: |
        Places to go through on the way, in the order you give them. Each one is
        named the same way `from` and `to` are.

        The order is yours and is not improved on: a way through three places is
        the way you asked for, not the shortest tour of them. Valhalla will
        optimise an order if asked, and asking would mean the line on the card
        stopped answering the question that was typed.
      type: array
      required: false
      example: [新宿駅, 渋谷駅]
      subType: station
      accepts: [place, location_coordinate, address, location]

    - name: to
      description: Destination — same as `from`; anything that names a place.
      type: string
      required: true
      example: 中野坂上駅
      subType: station
      accepts: [place, location_coordinate, address, location]

    - name: mode
      description: How you are travelling
      type: string
      default: walking
      required: false
      validation:
        enum:
          - walking
          - cycling
          - driving
      example: cycling

  state:
    - name: from
      description: Starting place, as asked for
      type: string
      persistent: true
      label: current
    - name: to
      description: Destination, as asked for
      type: string
      persistent: true
      label: current
    - name: via
      description: Places to go through, in order, as asked for
      type: array
      persistent: true
      label: current

    - name: mode
      description: Travel mode
      type: string
      persistent: true
      label: current
      initialValue: walking

    # Where you are, as told by something that knows — a location want, most
    # obviously. One slot serving both uses: the card drops a pin on it, and
    # "現在地から" copies it into `from` and re-routes. It is deliberately not
    # `from` itself: overwriting the question every time the phone moved would
    # make the card impossible to read, and a route you asked for should stay
    # the route you asked for until you say otherwise.
    - name: here
      description: Current position as {lat,lng}, imported from a location want
      type: object
      subType: location_coordinate
      persistent: true
      label: current
      importable: true

  examples:
    - title: Cycle home from the station
      description: The way from 国分寺駅 to 中野坂上駅 by bicycle
      want:
        metadata:
          name: route-home
          type: route
        spec:
          params:
            from: 国分寺駅
            to: 中野坂上駅
            mode: cycling
